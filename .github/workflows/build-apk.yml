name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Every CI build gets a higher versionCode, which app stores require.
      KENARET_VERSION_CODE: ${{ github.run_number }}
      HAS_RELEASE_KEY: ${{ secrets.KENARET_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners ship with the Android SDK (ANDROID_HOME) and accepted licenses;
      # the Android Gradle Plugin downloads any missing platform / build-tools automatically.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        run: chmod +x gradlew .github/scripts/gradle-with-annotations.sh

      - name: Build debug APK
        run: .github/scripts/gradle-with-annotations.sh assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kenaret-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Run unit tests
        run: .github/scripts/gradle-with-annotations.sh testDebugUnitTest

      # ---------- Signed release (runs only when the signing secrets are configured) ----------
      - name: Release signing not configured
        if: env.HAS_RELEASE_KEY != 'true'
        run: echo "::notice title=Release build skipped::Add the KENARET_KEYSTORE_BASE64, KENARET_KEYSTORE_PASSWORD, KENARET_KEY_ALIAS and KENARET_KEY_PASSWORD repository secrets to build a signed release."

      - name: Restore release keystore
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KENARET_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/kenaret-release.jks"
          echo "KENARET_KEYSTORE_PATH=$RUNNER_TEMP/kenaret-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KENARET_KEYSTORE_PASSWORD: ${{ secrets.KENARET_KEYSTORE_PASSWORD }}
          KENARET_KEY_ALIAS: ${{ secrets.KENARET_KEY_ALIAS }}
          KENARET_KEY_PASSWORD: ${{ secrets.KENARET_KEY_PASSWORD }}
        run: .github/scripts/gradle-with-annotations.sh assembleRelease bundleRelease

      - name: Verify release signature
        if: env.HAS_RELEASE_KEY == 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "Using $APKSIGNER"
          OUT=$("$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk 2>&1)
          STATUS=$?
          echo "$OUT"
          SUMMARY=$(echo "$OUT" | grep -E "Verifies|Verified using|certificate DN|SHA-256 digest" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          if [ $STATUS -eq 0 ]; then
            echo "::notice title=Release signature OK::${SUMMARY}"
          else
            echo "::error title=Release signature check failed::$(echo "$OUT" | tail -20 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
          fi
          exit $STATUS

      - name: Upload release APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kenaret-release-apk-v${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload release AAB (Google Play)
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kenaret-release-aab-v${{ github.run_number }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/kenaret-release.jks"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
